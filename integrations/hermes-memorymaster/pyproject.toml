[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memorymaster"
version = "0.1.0"
description = "Governed MemoryMaster memory provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "memorymaster[mcp]>=4.6.0",
    "httpx>=0.27",
    "mcp>=1.8.1,<2",
]

[project.scripts]
hermes-memorymaster = "hermes_memorymaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hermes_memorymaster.plugin_files" = ["plugin.yaml"]
